name: Update artwork image manifest

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate images.json
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')
          groups = {
              'ceramics': root / 'images' / 'ceramics',
              'felt': root / 'images' / 'felt',
              'painting': root / 'images' / 'painting',
              'sketches': root / 'images' / 'sketches',
          }
          allowed = {'.jpg', '.jpeg', '.png', '.webp', '.gif', '.avif'}

          def natural_key(path):
              return [int(x) if x.isdigit() else x.lower() for x in re.split(r'(\d+)', path.name)]

          data = {}
          for name, folder in groups.items():
              folder.mkdir(parents=True, exist_ok=True)
              files = [p for p in folder.iterdir() if p.is_file() and p.suffix.lower() in allowed]
              files.sort(key=natural_key)
              data[name] = [p.as_posix() for p in files]

          Path('images.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit manifest if changed
        shell: bash
        run: |
          if git diff --quiet -- images.json; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          git commit -m "Update artwork image manifest"
          git push
