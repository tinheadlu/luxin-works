<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lu Xin Artworks</title><meta name="description" content="Lu Xin — ceramics, felt and painting."><style>
:root{--bg:#f5f4f1;--ink:#1c1c1c;--muted:#777772;--line:rgba(28,28,28,.16)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit}.landing{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}.portal{position:relative;width:min(68vw,560px);aspect-ratio:1;border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;isolation:isolate;-webkit-mask-image:radial-gradient(circle closest-side at center,#000 0 67%,rgba(0,0,0,.98) 72%,rgba(0,0,0,.74) 81%,rgba(0,0,0,.30) 91%,transparent 100%);mask-image:radial-gradient(circle closest-side at center,#000 0 67%,rgba(0,0,0,.98) 72%,rgba(0,0,0,.74) 81%,rgba(0,0,0,.30) 91%,transparent 100%)}.layer{position:absolute;inset:-7%;background:url('2963_SnapseedCopy.jpeg') center/cover;transform:scale(1.12)}.blur-layer{filter:blur(31px) saturate(.72)}.sharp-layer{opacity:0;transition:opacity .7s ease,transform .8s ease;-webkit-mask-image:radial-gradient(circle closest-side at center,#000 0 48%,rgba(0,0,0,.98) 55%,rgba(0,0,0,.72) 67%,rgba(0,0,0,.25) 79%,transparent 91%);mask-image:radial-gradient(circle closest-side at center,#000 0 48%,rgba(0,0,0,.98) 55%,rgba(0,0,0,.72) 67%,rgba(0,0,0,.25) 79%,transparent 91%)}.name{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(24px,4vw,44px);font-weight:300;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 14px #0004;z-index:3}@media(hover:hover){.portal:hover .sharp-layer{opacity:1;transform:scale(1.02)}}.portal.is-focused .sharp-layer{opacity:1!important}.main{padding:34px 5vw 90px}.topbar{display:flex;justify-content:space-between;gap:24px}.brand{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:300;letter-spacing:.34em;text-decoration:none}.nav{display:flex;gap:28px}.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}.intro{margin-top:clamp(90px,16vh,180px)}.intro h1{font-size:clamp(30px,5vw,58px);font-weight:300;letter-spacing:.05em;margin:0;color:#d9d8d4}.categories{margin-top:clamp(55px,9vh,100px);border-top:1px solid var(--line)}.category{display:grid;grid-template-columns:1fr auto;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none}.category-title{font-size:clamp(24px,4.3vw,56px);font-weight:300}.category-no{font-size:11px;color:var(--muted)}.work-section{padding-top:130px;scroll-margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:34px}.section-head h2{font-size:clamp(28px,4vw,48px);font-weight:300;margin:0}.section-head span{font-size:10px;letter-spacing:.16em;color:var(--muted)}.gallery{columns:3 280px;column-gap:22px}.work{display:block;width:100%;height:auto;margin:0 0 22px;break-inside:avoid;cursor:zoom-in}.footer{padding-top:110px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.lightbox{position:fixed;inset:0;background:rgba(245,244,241,.96);z-index:20;display:none;align-items:center;justify-content:center;padding:4vw;cursor:zoom-out}.lightbox.open{display:flex}.lightbox img{max-width:92vw;max-height:90vh;object-fit:contain}.close{position:absolute;right:28px;top:22px;border:0;background:none;font-size:26px;font-weight:200;cursor:pointer}@media(max-width:700px){.portal{width:min(84vw,430px)}.name{font-size:24px}.main{padding:24px 24px 60px}.nav{gap:16px}.intro{margin-top:120px}.intro h1{font-size:36px}.categories{margin-top:58px}.category{padding:20px 0}.work-section{padding-top:90px}.gallery{columns:2 135px;column-gap:12px}.work{margin-bottom:12px}.section-head{margin-bottom:20px}}
</style></head><body><section class="landing" id="top"><button class="portal" id="portal"><span class="layer blur-layer"></span><span class="layer sharp-layer"></span><span class="name">LU XIN</span></button></section><main class="main" id="main"><header class="topbar"><a class="brand" href="#top">卢 欣</a><nav class="nav"><a href="#works">Works</a><a href="#about">About</a><a href="#contact">Contact</a></nav></header><section class="intro"><h1>Works</h1></section><section class="categories" id="works"><a class="category" href="#ceramics"><span class="category-title">Ceramics</span><span class="category-no">01</span></a><a class="category" href="#felt"><span class="category-title">Felt</span><span class="category-no">02</span></a><a class="category" href="#painting"><span class="category-title">Painting</span><span class="category-no">03</span></a></section><section class="work-section" id="ceramics"><div class="section-head"><h2>Ceramics</h2><span>01</span></div><div class="gallery" id="ceramics-gallery"></div></section><section class="work-section" id="felt"><div class="section-head"><h2>Felt</h2><span>02</span></div><div class="gallery" id="felt-gallery"></div></section><section class="work-section" id="painting"><div class="section-head"><h2>Painting</h2><span>03</span></div><div class="gallery" id="painting-gallery"></div></section><footer class="footer"><span id="about">Artist · Lu Xin</span><span id="contact"></span></footer></main><div class="lightbox" id="lightbox"><button class="close" aria-label="Close">×</button><img alt="Artwork"></div><script>
const portal=document.getElementById('portal'),main=document.getElementById('main');let touchFocused=false;portal.addEventListener('click',e=>{const t=matchMedia('(hover:none)').matches||matchMedia('(pointer:coarse)').matches;if(t&&!touchFocused){e.preventDefault();portal.classList.add('is-focused');touchFocused=true;return}main.scrollIntoView({behavior:'smooth'})});
const ceramics=Array.from({length:25},(_,i)=>`images/ceramics/ceramics${String(i+1).padStart(2,'0')}.${i<22?'jpeg':'JPG'}`);const felt=['images/felt/felt001.jpeg','images/felt/felt002.jpeg'];const painting=['images/painting/oilpaint001.JPG','images/painting/oilpaint002.JPG','images/painting/oilpaint003.JPG','images/painting/oilpaint004.JPG','images/painting/paint001.jpg','images/painting/paint002.jpg','images/painting/paint003.jpg','images/painting/paint004.jpg','images/painting/paint005.JPG','images/painting/paint006.jpg','images/painting/paint007.JPG','images/painting/paint008.jpeg','images/painting/paint009.JPG'];function fill(id,files){const g=document.getElementById(id);files.forEach((src,i)=>{const im=new Image();im.className='work';im.src=src;im.alt='Lu Xin artwork '+(i+1);im.loading='lazy';im.addEventListener('click',()=>openBox(src));g.appendChild(im)})}fill('ceramics-gallery',ceramics);fill('felt-gallery',felt);fill('painting-gallery',painting);const box=document.getElementById('lightbox'),big=box.querySelector('img');function openBox(src){big.src=src;box.classList.add('open');document.body.style.overflow='hidden'}function closeBox(){box.classList.remove('open');document.body.style.overflow=''}box.addEventListener('click',closeBox);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBox()});
</script></body></html>
