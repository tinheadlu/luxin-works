<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lu Xin Artworks</title>
<meta name="description" content="Lu Xin — painting, ceramics, fiber and mixed media.">
<style>
:root{--bg:#f5f4f1;--ink:#1c1c1c;--muted:#777772;--line:rgba(28,28,28,.16)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a{color:inherit}

/* LANDING */
.landing{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 28px;position:relative;overflow:hidden}
.landing-title{position:absolute;top:clamp(48px,9vh,105px);left:50%;transform:translateX(-50%);font-size:clamp(22px,3vw,36px);font-weight:300;letter-spacing:.12em;white-space:nowrap;color:#2b2b29;z-index:5}
.portal{position:relative;width:min(68vw,560px);aspect-ratio:1;border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;isolation:isolate;
  -webkit-mask-image:radial-gradient(circle closest-side at center,#000 0 67%,rgba(0,0,0,.98) 72%,rgba(0,0,0,.74) 81%,rgba(0,0,0,.30) 91%,transparent 100%);
  mask-image:radial-gradient(circle closest-side at center,#000 0 67%,rgba(0,0,0,.98) 72%,rgba(0,0,0,.74) 81%,rgba(0,0,0,.30) 91%,transparent 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.layer{position:absolute;inset:-7%;background-image:url('2963_SnapseedCopy.jpeg');background-size:cover;background-position:center center;transform:scale(1.12);pointer-events:none}
.blur-layer{filter:blur(31px) saturate(.72);-webkit-filter:blur(31px) saturate(.72)}
.sharp-layer{filter:blur(0) saturate(1);-webkit-filter:blur(0) saturate(1);opacity:0;transition:opacity .7s ease,transform .8s ease;
  -webkit-mask-image:radial-gradient(circle closest-side at center,#000 0 48%,rgba(0,0,0,.98) 55%,rgba(0,0,0,.72) 67%,rgba(0,0,0,.25) 79%,transparent 91%);
  mask-image:radial-gradient(circle closest-side at center,#000 0 48%,rgba(0,0,0,.98) 55%,rgba(0,0,0,.72) 67%,rgba(0,0,0,.25) 79%,transparent 91%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.name{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(24px,4vw,44px);font-weight:300;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 14px rgba(0,0,0,.26);pointer-events:none;z-index:3}
@media(hover:hover) and (pointer:fine){.portal:hover .sharp-layer,.portal:focus-visible .sharp-layer{opacity:1;transform:scale(1.02)}}
.portal.is-focused .sharp-layer{opacity:1!important;transform:scale(1.02)!important}

/* MAIN */
.main{min-height:100svh;padding:34px 5vw 70px;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:15px;letter-spacing:.22em;text-decoration:none;white-space:nowrap}.nav{display:flex;gap:28px;align-items:center}.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#454541}.nav a:hover{opacity:.55}.intro{margin-top:clamp(90px,16vh,180px);max-width:760px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}.intro h1{font-size:clamp(42px,8vw,104px);font-weight:300;letter-spacing:.05em;line-height:.95;margin:0}.categories{margin-top:clamp(70px,12vh,140px);border-top:1px solid var(--line)}.category{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none}.category-title{font-size:clamp(24px,4.3vw,56px);font-weight:300;letter-spacing:.04em;transition:transform .25s ease}.category-no{font-size:11px;letter-spacing:.15em;color:var(--muted)}.category:hover .category-title{transform:translateX(8px)}.footer{margin-top:auto;padding-top:80px;display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){.landing{padding-top:70px}.landing-title{top:52px;font-size:24px;letter-spacing:.09em}.portal{width:min(84vw,430px)}.main{padding:24px 24px 48px}.topbar{align-items:flex-start}.nav{gap:16px;flex-wrap:wrap;justify-content:flex-end}.intro{margin-top:100px}.categories{margin-top:72px}.category{padding:20px 0}}
</style>
</head>
<body>
<section class="landing" id="top">
  <div class="landing-title">Lu Xin Artworks</div>
  <button class="portal" id="portal" aria-label="Enter Lu Xin artworks">
    <span class="layer blur-layer"></span>
    <span class="layer sharp-layer"></span>
    <span class="name">LU XIN</span>
  </button>
</section>
<main class="main" id="main">
  <header class="topbar"><a class="brand" href="#top">LU XIN</a><nav class="nav" aria-label="Main navigation"><a href="#works">Works</a><a href="#about">About</a><a href="#contact">Contact</a></nav></header>
  <section class="intro"><div class="eyebrow">Selected Works</div><h1>Works</h1></section>
  <section class="categories" id="works" aria-label="Work categories"><a class="category" href="#painting"><span class="category-title">Painting</span><span class="category-no">01</span></a><a class="category" href="#ceramics"><span class="category-title">Ceramics</span><span class="category-no">02</span></a><a class="category" href="#fiber"><span class="category-title">Fiber</span><span class="category-no">03</span></a><a class="category" href="#mixed-media"><span class="category-title">Mixed Media</span><span class="category-no">04</span></a></section>
  <footer class="footer"><span id="about">Artist · Lu Xin</span><span id="contact">Bangkok</span></footer>
</main>
<script>
const portal=document.getElementById('portal');
const main=document.getElementById('main');
let touchFocused=false;
portal.addEventListener('click',(e)=>{
  const touchMode=matchMedia('(hover:none)').matches || matchMedia('(pointer:coarse)').matches;
  if(touchMode && !touchFocused){e.preventDefault();portal.classList.add('is-focused');touchFocused=true;return;}
  main.scrollIntoView({behavior:'smooth'});
});
</script>
</body>
</html>
