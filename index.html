<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lu Xin Artworks</title><meta name="description" content="Lu Xin — ceramics, felt and painting."><style>
:root{--bg:#f5f4f1;--ink:#1c1c1c;--muted:#777772;--line:rgba(28,28,28,.16)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit}.landing{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}.portal{position:relative;width:min(68vw,560px);aspect-ratio:1;border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;isolation:isolate;-webkit-mask-image:radial-gradient(circle closest-side at center,#000 0 67%,rgba(0,0,0,.98) 72%,rgba(0,0,0,.74) 81%,rgba(0,0,0,.30) 91%,transparent 100%);mask-image:radial-gradient(circle closest-side at center,#000 0 67%,rgba(0,0,0,.98) 72%,rgba(0,0,0,.74) 81%,rgba(0,0,0,.30) 91%,transparent 100%)}.layer{position:absolute;inset:-7%;background-position:center;background-size:cover;transform:scale(1.12)}.blur-layer{filter:blur(31px) saturate(.72);opacity:0;transition:opacity 1.4s ease}.blur-layer.active{opacity:1}.sharp-layer{opacity:0;transition:opacity .7s ease,transform .8s ease;-webkit-mask-image:radial-gradient(circle closest-side at center,#000 0 48%,rgba(0,0,0,.98) 55%,rgba(0,0,0,.72) 67%,rgba(0,0,0,.25) 79%,transparent 91%);mask-image:radial-gradient(circle closest-side at center,#000 0 48%,rgba(0,0,0,.98) 55%,rgba(0,0,0,.72) 67%,rgba(0,0,0,.25) 79%,transparent 91%)}.sharp-layer.current{z-index:2}.name{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(24px,4vw,44px);font-weight:300;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 14px #0004;z-index:3}@media(hover:hover){.portal:hover .sharp-layer.current{opacity:1;transform:scale(1.02)}}.portal.is-focused .sharp-layer.current{opacity:1!important;transform:scale(1.02)}.main{padding:34px 5vw 90px}.topbar{display:flex;justify-content:space-between;gap:24px}.brand{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:300;letter-spacing:.34em;text-decoration:none}.nav{display:flex;gap:28px}.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}.intro{margin-top:clamp(90px,16vh,180px)}.intro h1{font-size:clamp(30px,5vw,58px);font-weight:300;letter-spacing:.05em;margin:0;color:#d9d8d4}.categories{margin-top:clamp(55px,9vh,100px);border-top:1px solid var(--line)}.category{display:grid;grid-template-columns:1fr auto;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}.category-title{font-size:clamp(24px,4.3vw,56px);font-weight:300}.category-no{font-size:11px;color:var(--muted)}.category.active{border-bottom:0}.viewer{display:none;border-bottom:1px solid var(--line);padding:14px 0 38px}.viewer.open{display:block}.viewer-meta{display:flex;justify-content:flex-end;margin-bottom:8px}.viewer-count{font-size:10px;letter-spacing:.16em;color:var(--muted)}.stage{position:relative;min-height:68vh;display:flex;align-items:center;justify-content:center;padding:10px 70px 20px;overflow:hidden}.stage img{display:block;max-width:min(100%,1100px);max-height:70vh;width:auto;height:auto;object-fit:contain;cursor:zoom-in;transform:scale(1);transform-origin:50% 50%;transition:transform .22s ease;touch-action:none;user-select:none;-webkit-user-drag:none}.stage img.zoomed{transform:scale(2.35);cursor:zoom-out;transition:transform .18s ease}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink);font-size:48px;font-weight:200;line-height:1;padding:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:3}.arrow.prev{left:0}.arrow.next{right:0}.viewer-close{display:block;margin:8px auto 0;border:0;background:transparent;padding:8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}.about-section{margin-top:clamp(110px,18vh,190px);padding-top:26px;border-top:1px solid var(--line);display:none;grid-template-columns:minmax(90px,.45fr) minmax(280px,1.15fr) minmax(260px,.9fr);gap:40px;align-items:start}.about-section.open{display:grid}.about-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.about-copy{max-width:650px;color:var(--ink);font-weight:300}.about-name{font-size:clamp(26px,2.8vw,36px);line-height:1.2;margin:0 0 10px}.about-text{font-size:clamp(16px,1.5vw,20px);line-height:1.55;margin:0;color:var(--ink)}.about-photo{width:100%;max-width:460px;justify-self:end}.about-photo img{display:block;width:100%;height:auto}.about-close{grid-column:2/4;justify-self:end;border:0;background:transparent;padding:8px 0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}.footer{padding-top:110px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}@media(max-width:700px){.landing{min-height:0;padding:110px 24px 38px}.portal{width:min(84vw,430px)}.name{font-size:24px}.main{padding:24px 24px 60px}.nav{gap:16px}.intro{margin-top:120px}.intro h1{font-size:36px}.categories{margin-top:58px}.category{padding:20px 0}.viewer{padding:10px 0 26px}.stage{min-height:58vh;padding:8px 42px 14px}.stage img{max-width:100%;max-height:60vh}.stage img.zoomed{transform:scale(2.6)}.arrow{font-size:38px;padding:12px}.arrow.prev{left:-8px}.arrow.next{right:-8px}.about-section{grid-template-columns:1fr 1fr;gap:22px 18px;margin-top:100px}.about-title{grid-column:1/-1}.about-copy{grid-column:1}.about-photo{grid-column:2;justify-self:stretch;max-width:none}.about-name{font-size:28px;margin-bottom:8px}.about-text{font-size:15px;line-height:1.5}.about-close{grid-column:1/-1}}
</style></head><body><section class="landing" id="top"><button class="portal" id="portal" aria-label="Open current artwork"><span class="layer blur-layer active" id="home-blur-a"></span><span class="layer blur-layer" id="home-blur-b"></span><span class="layer sharp-layer current" id="home-sharp-a"></span><span class="layer sharp-layer" id="home-sharp-b"></span><span class="name">LU XIN</span></button></section><main class="main" id="main"><header class="topbar"><a class="brand internal-link" href="#top">卢 欣</a><nav class="nav"><a class="internal-link" href="#works">Works</a><a id="about-toggle" href="#about">About</a><a class="internal-link" href="#contact">Contact</a></nav></header><section class="intro"><h1>Works</h1></section><section class="categories" id="works"><a class="category" href="#" data-set="ceramics"><span class="category-title">Ceramics</span><span class="category-no">01</span></a><a class="category" href="#" data-set="felt"><span class="category-title">Felt</span><span class="category-no">02</span></a><a class="category" href="#" data-set="painting"><span class="category-title">Painting</span><span class="category-no">03</span></a></section><section class="viewer" id="viewer"><div class="viewer-meta"><span class="viewer-count" id="viewer-count">01 / 24</span></div><div class="stage"><button class="arrow prev" id="prev" aria-label="Previous artwork">‹</button><img id="viewer-image" alt="Lu Xin artwork"><button class="arrow next" id="next" aria-label="Next artwork">›</button></div><button class="viewer-close" id="close-viewer">Close</button></section><section class="about-section" id="about"><div class="about-title">About</div><div class="about-copy"><p class="about-name">Lu Xin</p><p class="about-text">born in Beijing<br>based in Austria<br>Ceramics, wool, painting, mixed materials…<br>She makes objects that sit somewhere between the familiar and the strange.</p></div><div class="about-photo"><img src="images/other/luxin01.JPG" alt="Lu Xin working in her studio" loading="lazy"></div><button class="about-close" id="about-close">Close</button></section><footer class="footer"><span>Artist · Lu Xin</span><span id="contact"></span></footer></main><script>
const portal=document.getElementById('portal'),homeBlurA=document.getElementById('home-blur-a'),homeBlurB=document.getElementById('home-blur-b'),homeSharpA=document.getElementById('home-sharp-a'),homeSharpB=document.getElementById('home-sharp-b');function goToHash(hash){const target=document.querySelector(hash);if(!target)return;target.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',hash)}const aboutToggle=document.getElementById('about-toggle'),aboutSection=document.getElementById('about'),aboutClose=document.getElementById('about-close');function closeAbout(scroll=false){if(!aboutSection.classList.contains('open'))return;aboutSection.classList.remove('open');history.replaceState(null,'','#works');if(scroll)requestAnimationFrame(()=>document.getElementById('works').scrollIntoView({behavior:'smooth',block:'start'}))}document.querySelectorAll('a.internal-link[href^="#"]').forEach(a=>{a.addEventListener('click',e=>{const hash=a.getAttribute('href');if(!hash||hash==='#')return;e.preventDefault();closeAbout(false);goToHash(hash)})});aboutToggle.addEventListener('click',e=>{e.preventDefault();const opening=!aboutSection.classList.contains('open');if(opening){aboutSection.classList.add('open');history.replaceState(null,'','#about');requestAnimationFrame(()=>aboutSection.scrollIntoView({behavior:'smooth',block:'start'}))}else closeAbout(true)});aboutClose.addEventListener('click',()=>closeAbout(true));
let sets={ceramics:Array.from({length:24},(_,i)=>`images/ceramics/ceramics${String(i+1).padStart(2,'0')}.${i<22?'jpeg':'JPG'}`),felt:Array.from({length:12},(_,i)=>`images/felt/felt${String(i+1).padStart(3,'0')}.${i<11?'jpeg':'JPG'}`),painting:['images/painting/oilpaint001.JPG','images/painting/oilpaint002.JPG','images/painting/oilpaint003.JPG','images/painting/oilpaint004.JPG','images/painting/paint001.jpg','images/painting/paint002.jpg','images/painting/paint003.jpg','images/painting/paint004.jpg','images/painting/paint005.JPG','images/painting/paint006.jpg','images/painting/paint007.JPG','images/painting/paint008.jpeg','images/painting/paint009.JPG','images/painting/paint010.JPG','images/painting/paint011.JPG','images/painting/paint012.JPG']};
const viewer=document.getElementById('viewer'),img=document.getElementById('viewer-image'),count=document.getElementById('viewer-count');let currentSet=null,index=0,zoomed=false,activeCategory=null;function resetZoom(){zoomed=false;img.classList.remove('zoomed');img.style.transformOrigin='50% 50%'}function render(){resetZoom();const files=sets[currentSet];if(!files||!files.length)return;img.src=files[index];img.alt=`Lu Xin ${currentSet} artwork ${index+1}`;count.textContent=`${String(index+1).padStart(2,'0')} / ${String(files.length).padStart(2,'0')}`}function closeViewer(){resetZoom();viewer.classList.remove('open');if(activeCategory)activeCategory.classList.remove('active');activeCategory=null;currentSet=null;history.replaceState(null,'','#works')}function openSet(a,startIndex=0){closeAbout(false);const name=a.dataset.set;if(activeCategory===a&&viewer.classList.contains('open')&&startIndex===index){closeViewer();return}if(activeCategory)activeCategory.classList.remove('active');activeCategory=a;activeCategory.classList.add('active');currentSet=name;index=Math.max(0,Math.min(startIndex,(sets[name]?.length||1)-1));a.insertAdjacentElement('afterend',viewer);viewer.classList.add('open');render();history.replaceState(null,'','#'+name);requestAnimationFrame(()=>a.scrollIntoView({behavior:'smooth',block:'start'}))}function step(dir){const files=sets[currentSet];if(!files||!files.length)return;index=(index+dir+files.length)%files.length;render()}function setOrigin(clientX,clientY){const r=img.getBoundingClientRect();const x=Math.max(0,Math.min(100,(clientX-r.left)/r.width*100));const y=Math.max(0,Math.min(100,(clientY-r.top)/r.height*100));img.style.transformOrigin=`${x}% ${y}%`}function toggleZoom(clientX,clientY){zoomed=!zoomed;if(zoomed){setOrigin(clientX,clientY);img.classList.add('zoomed')}else resetZoom()}
document.querySelectorAll('.category').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openSet(a,0)}));document.getElementById('prev').addEventListener('click',()=>step(-1));document.getElementById('next').addEventListener('click',()=>step(1));document.getElementById('close-viewer').addEventListener('click',closeViewer);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&aboutSection.classList.contains('open')){closeAbout(true);return}if(!viewer.classList.contains('open'))return;if(e.key==='Escape'){if(zoomed)resetZoom();else closeViewer()}if(!zoomed&&e.key==='ArrowLeft')step(-1);if(!zoomed&&e.key==='ArrowRight')step(1)});
let pDown=false,startX=0,startY=0,moved=false;img.addEventListener('pointerdown',e=>{pDown=true;moved=false;startX=e.clientX;startY=e.clientY;img.setPointerCapture?.(e.pointerId);if(zoomed)setOrigin(e.clientX,e.clientY)});img.addEventListener('pointermove',e=>{if(!pDown)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.hypot(dx,dy)>7)moved=true;if(zoomed){e.preventDefault();setOrigin(e.clientX,e.clientY)}});img.addEventListener('pointerup',e=>{if(!pDown)return;pDown=false;const dx=e.clientX-startX,dy=e.clientY-startY;if(zoomed){if(!moved)toggleZoom(e.clientX,e.clientY);return}if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){step(dx>0?-1:1);return}if(!moved)toggleZoom(e.clientX,e.clientY)});img.addEventListener('pointercancel',()=>{pDown=false});img.addEventListener('mousemove',e=>{if(zoomed&&!pDown)setOrigin(e.clientX,e.clientY)});
let homeItems=[],homePos=-1,homeCurrent=null,homeTimer=null,homeFocused=false,homeSlot=0;function buildHomeItems(){homeItems=[];['ceramics','felt','painting'].forEach(setName=>(sets[setName]||[]).forEach((src,i)=>homeItems.push({set:setName,index:i,src})));for(let i=homeItems.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[homeItems[i],homeItems[j]]=[homeItems[j],homeItems[i]]}homePos=-1}function applyHome(item,initial=false){const nextBlur=homeSlot===0?homeBlurA:homeBlurB,oldBlur=homeSlot===0?homeBlurB:homeBlurA,nextSharp=homeSlot===0?homeSharpA:homeSharpB,oldSharp=homeSlot===0?homeSharpB:homeSharpA;const url=`url('${item.src}')`;nextBlur.style.backgroundImage=url;nextSharp.style.backgroundImage=url;oldSharp.classList.remove('current');nextSharp.classList.add('current');if(initial){nextBlur.classList.add('active');oldBlur.classList.remove('active')}else{requestAnimationFrame(()=>{nextBlur.classList.add('active');oldBlur.classList.remove('active')})}homeSlot=1-homeSlot}function showNextHome(){if(!homeItems.length)return;homeFocused=false;portal.classList.remove('is-focused');homePos=(homePos+1)%homeItems.length;homeCurrent=homeItems[homePos];applyHome(homeCurrent,homePos===0)}function startHomeRotation(){clearInterval(homeTimer);buildHomeItems();homeSlot=0;homeBlurA.classList.remove('active');homeBlurB.classList.remove('active');homeSharpA.classList.remove('current');homeSharpB.classList.remove('current');showNextHome();homeTimer=setInterval(showNextHome,7000)}portal.addEventListener('click',e=>{if(!homeCurrent)return;const touchMode=matchMedia('(hover:none)').matches||matchMedia('(pointer:coarse)').matches;if(touchMode&&!homeFocused){e.preventDefault();homeFocused=true;portal.classList.add('is-focused');clearInterval(homeTimer);homeTimer=setInterval(showNextHome,7000);return}const a=document.querySelector(`.category[data-set="${homeCurrent.set}"]`);if(a){homeFocused=false;portal.classList.remove('is-focused');openSet(a,homeCurrent.index)}});
startHomeRotation();fetch('images.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('manifest');return r.json()}).then(data=>{if(data&&data.ceramics&&data.felt&&data.painting){sets=data;startHomeRotation()}}).catch(()=>{});
</script></body></html>
