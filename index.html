acity:1!important;transform:scale(1.02)!important}.main{min-height:100svh;padding:34px 5vw 70px;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:300;letter-spacing:.34em;text-decoration:none;white-space:nowrap}.nav{display:flex;gap:28px}.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#454541}.intro{margin-top:clamp(90px,16vh,180px)}.intro h1{font-size:clamp(30px,5vw,58px);font-weight:300;letter-spacing:.05em;line-height:1;margin:0;color:#d9d8d4}.categories{margin-top:clamp(55px,9vh,100px);border-top:1px solid var(--line)}.category{display:grid;grid-template-columns:1fr auto;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none}.category-title{font-size:clamp(24px,4.3vw,56px);font-weight:300;letter-spacing:.04em}.category-no{font-size:11px;letter-spacing:.15em;color:var(--muted)}.footer{margin-top:auto;padding-top:80px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}@media(max-width:700px){.portal{width:min(84vw,430px)}.name{font-size:24px;letter-spacing:.12em;text-indent:.12em}.main{padding:24px 24px 48px}.nav{gap:16px}.intro{margin-top:120px}.intro h1{font-size:36px;color:#dcdbd7}.categories{margin-top:58px}.category{padding:20px 0}}
