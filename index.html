<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lu Xin Artworks</title><meta name="description" content="Lu Xin — ceramics, felt and painting."><style>
:root{--bg:#f5f4f1;--ink:#1c1c1c;--muted:#777772;--line:rgba(28,28,28,.16)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit}.landing{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}.portal{position:relative;width:min(68vw,560px);aspect-ratio:1;border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;isolation:isolate;-webkit-mask-image:radial-gradient(circle closest-side at center,#000 0 67%,rgba(0,0,0,.98) 72%,rgba(0,0,0,.74) 81%,rgba(0,0,0,.30) 91%,transparent 100%);mask-image:radial-gradient(circle closest-side at center,#000 0 67%,rgba(0,0,0,.98) 72%,rgba(0,0,0,.74) 81%,rgba(0,0,0,.30) 91%,transparent 100%)}.layer{position:absolute;inset:-7%;background:url('2963_SnapseedCopy.jpeg') center/cover;transform:scale(1.12)}.blur-layer{filter:blur(31px) saturate(.72)}.sharp-layer{opacity:0;transition:opacity .7s ease,transform .8s ease;-webkit-mask-image:radial-gradient(circle closest-side at center,#000 0 48%,rgba(0,0,0,.98) 55%,rgba(0,0,0,.72) 67%,rgba(0,0,0,.25) 79%,transparent 91%);mask-image:radial-gradient(circle closest-side at center,#000 0 48%,rgba(0,0,0,.98) 55%,rgba(0,0,0,.72) 67%,rgba(0,0,0,.25) 79%,transparent 91%)}.name{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(24px,4vw,44px);font-weight:300;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 14px #0004;z-index:3}@media(hover:hover){.portal:hover .sharp-layer{opacity:1;transform:scale(1.02)}}.portal.is-focused .sharp-layer{opacity:1!important}.main{padding:34px 5vw 90px}.topbar{display:flex;justify-content:space-between;gap:24px}.brand{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:300;letter-spacing:.34em;text-decoration:none}.nav{display:flex;gap:28px}.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}.intro{margin-top:clamp(90px,16vh,180px)}.intro h1{font-size:clamp(30px,5vw,58px);font-weight:300;letter-spacing:.05em;margin:0;color:#d9d8d4}.categories{margin-top:clamp(55px,9vh,100px);border-top:1px solid var(--line)}.category{display:grid;grid-template-columns:1fr auto;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}.category-title{font-size:clamp(24px,4.3vw,56px);font-weight:300}.category-no{font-size:11px;color:var(--muted)}.viewer{display:none;min-height:100svh;padding-top:70px;scroll-margin-top:10px}.viewer.open{display:block}.viewer-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:28px}.viewer-head h2{font-size:clamp(28px,4vw,48px);font-weight:300;margin:0}.viewer-count{font-size:10px;letter-spacing:.16em;color:var(--muted)}.stage{position:relative;min-height:70vh;display:flex;align-items:center;justify-content:center;padding:10px 70px 32px}.stage img{display:block;max-width:min(100%,1100px);max-height:72vh;width:auto;height:auto;object-fit:contain}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink);font-size:48px;font-weight:200;line-height:1;padding:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}.arrow.prev{left:0}.arrow.next{right:0}.viewer-back{display:inline-block;margin-top:18px;border:0;background:transparent;padding:0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}.footer{padding-top:110px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}@media(max-width:700px){.portal{width:min(84vw,430px)}.name{font-size:24px}.main{padding:24px 24px 60px}.nav{gap:16px}.intro{margin-top:120px}.intro h1{font-size:36px}.categories{margin-top:58px}.category{padding:20px 0}.viewer{padding-top:50px;min-height:90svh}.viewer-head{margin-bottom:14px}.stage{min-height:62vh;padding:8px 42px 20px}.stage img{max-width:100%;max-height:64vh}.arrow{font-size:38px;padding:12px}.arrow.prev{left:-8px}.arrow.next{right:-8px}}
</style></head><body><section class="landing" id="top"><button class="portal" id="portal"><span class="layer blur-layer"></span><span class="layer sharp-layer"></span><span class="name">LU XIN</span></button></section><main class="main" id="main"><header class="topbar"><a class="brand internal-link" href="#top">卢 欣</a><nav class="nav"><a class="internal-link" href="#works">Works</a><a class="internal-link" href="#about">About</a><a class="internal-link" href="#contact">Contact</a></nav></header><section class="intro"><h1>Works</h1></section><section class="categories" id="works"><a class="category" href="#viewer" data-set="ceramics" data-title="Ceramics"><span class="category-title">Ceramics</span><span class="category-no">01</span></a><a class="category" href="#viewer" data-set="felt" data-title="Felt"><span class="category-title">Felt</span><span class="category-no">02</span></a><a class="category" href="#viewer" data-set="painting" data-title="Painting"><span class="category-title">Painting</span><span class="category-no">03</span></a></section><section class="viewer" id="viewer"><div class="viewer-head"><h2 id="viewer-title">Ceramics</h2><span class="viewer-count" id="viewer-count">01 / 25</span></div><div class="stage"><button class="arrow prev" id="prev" aria-label="Previous artwork">‹</button><img id="viewer-image" alt="Lu Xin artwork"><button class="arrow next" id="next" aria-label="Next artwork">›</button></div><button class="viewer-back" id="back">Back to Works</button></section><footer class="footer"><span id="about">Artist · Lu Xin</span><span id="contact"></span></footer></main><script>
const portal=document.getElementById('portal'),main=document.getElementById('main');let touchFocused=false;portal.addEventListener('click',e=>{const t=matchMedia('(hover:none)').matches||matchMedia('(pointer:coarse)').matches;if(t&&!touchFocused){e.preventDefault();portal.classList.add('is-focused');touchFocused=true;return}main.scrollIntoView({behavior:'smooth',block:'start'})});
function goToHash(hash){const target=document.querySelector(hash);if(!target)return;target.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',hash)}document.querySelectorAll('a.internal-link[href^="#"]').forEach(a=>{a.addEventListener('click',e=>{const hash=a.getAttribute('href');if(!hash||hash==='#')return;e.preventDefault();goToHash(hash)})});
const sets={ceramics:Array.from({length:25},(_,i)=>`images/ceramics/ceramics${String(i+1).padStart(2,'0')}.${i<22?'jpeg':'JPG'}`),felt:['images/felt/felt001.jpeg','images/felt/felt002.jpeg'],painting:['images/painting/oilpaint001.JPG','images/painting/oilpaint002.JPG','images/painting/oilpaint003.JPG','images/painting/oilpaint004.JPG','images/painting/paint001.jpg','images/painting/paint002.jpg','images/painting/paint003.jpg','images/painting/paint004.jpg','images/painting/paint005.JPG','images/painting/paint006.jpg','images/painting/paint007.JPG','images/painting/paint008.jpeg','images/painting/paint009.JPG','images/painting/paint010.JPG','images/painting/paint011.JPG','images/painting/paint012.JPG']};
const viewer=document.getElementById('viewer'),img=document.getElementById('viewer-image'),title=document.getElementById('viewer-title'),count=document.getElementById('viewer-count');let currentSet='ceramics',index=0;function render(){const files=sets[currentSet];img.src=files[index];img.alt=`Lu Xin ${currentSet} artwork ${index+1}`;count.textContent=`${String(index+1).padStart(2,'0')} / ${String(files.length).padStart(2,'0')}`}function openSet(name,label){currentSet=name;index=0;title.textContent=label;viewer.classList.add('open');render();requestAnimationFrame(()=>viewer.scrollIntoView({behavior:'smooth',block:'start'}));history.replaceState(null,'','#'+name)}function step(dir){const files=sets[currentSet];index=(index+dir+files.length)%files.length;render()}
document.querySelectorAll('.category').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openSet(a.dataset.set,a.dataset.title)}));document.getElementById('prev').addEventListener('click',()=>step(-1));document.getElementById('next').addEventListener('click',()=>step(1));document.getElementById('back').addEventListener('click',()=>goToHash('#works'));document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
let x0=null;img.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});img.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45)step(dx>0?-1:1);x0=null},{passive:true});
</script></body></html>
