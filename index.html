<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LU XIN — Works</title>
<meta name="description" content="Lu Xin — painting, ceramics, fiber and mixed media.">
<style>
:root{--bg:#f5f4f1;--ink:#1c1c1c;--muted:#7a7a76}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.landing{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative}
.portal{position:relative;width:min(68vw,560px);aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;border:0;padding:0;background:#d9d3c8;box-shadow:0 12px 50px rgba(0,0,0,.08)}
.visual{position:absolute;inset:-8%;background:
radial-gradient(circle at 64% 30%,#e8d7b8 0 13%,transparent 28%),
radial-gradient(circle at 72% 62%,#bc6953 0 10%,transparent 27%),
radial-gradient(circle at 27% 28%,#7f8a64 0 12%,transparent 30%),
radial-gradient(circle at 34% 64%,#4b4842 0 22%,transparent 45%),
linear-gradient(135deg,#d8d2c5,#8e897d 56%,#c5b6a7);
filter:blur(26px) saturate(.82);transform:scale(1.12);transition:filter .7s ease,transform .9s ease}
.portal::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.name{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(24px,4vw,44px);font-weight:300;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 14px rgba(0,0,0,.28);transition:opacity .35s ease}
.portal:hover .visual,.portal:focus-visible .visual,.portal.is-focused .visual{filter:blur(2px) saturate(1);transform:scale(1)}
.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.works{min-height:100svh;padding:72px 7vw 96px;display:flex;flex-direction:column;justify-content:center}
.works h1{font-size:clamp(32px,6vw,76px);font-weight:300;letter-spacing:.12em;margin:0 0 18px}
.works p{max-width:560px;color:#666;line-height:1.7;margin:0}
.back{display:inline-block;margin-top:38px;color:inherit;text-decoration:none;font-size:13px;letter-spacing:.12em}
@media(max-width:700px){.portal{width:min(82vw,430px)}.hint{bottom:20px}}
</style>
</head>
<body>
<section class="landing" id="top">
  <button class="portal" id="portal" aria-label="Enter Lu Xin works">
    <span class="visual"></span>
    <span class="name">LU XIN</span>
  </button>
  <div class="hint">hover to focus · click to enter</div>
</section>
<section class="works" id="works">
  <h1>LU XIN</h1>
  <p>Painting · Ceramics · Fiber · Mixed Media</p>
  <p style="margin-top:16px">Temporary test page. Artwork categories and images will be added here next.</p>
  <a class="back" href="#top">↑ BACK</a>
</section>
<script>
const portal=document.getElementById('portal');
let touchFocused=false;
portal.addEventListener('click',()=>{
  if(matchMedia('(hover: none)').matches && !touchFocused){portal.classList.add('is-focused');touchFocused=true;return}
  document.getElementById('works').scrollIntoView({behavior:'smooth'});
});
</script>
</body>
</html>
