<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LU XIN — Works</title>
<meta name="description" content="Lu Xin — painting, ceramics, fiber and mixed media.">
<style>
:root{--bg:#f5f4f1;--ink:#1c1c1c;--muted:#777772;--line:rgba(28,28,28,.16)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a{color:inherit}
.landing{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.portal{position:relative;width:min(68vw,560px);aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;border:0;padding:0;background:#b48a5f;box-shadow:0 12px 50px rgba(0,0,0,.08);-webkit-tap-highlight-color:transparent}
.visual{position:absolute;inset:-9%;background-image:url('2963_SnapseedCopy.jpeg');background-size:cover;background-position:center center;filter:blur(34px) saturate(.72);-webkit-filter:blur(34px) saturate(.72);transform:scale(1.17);transition:filter .9s ease,-webkit-filter .9s ease,transform 1.05s ease}
.portal::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.42)}
.name{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(24px,4vw,44px);font-weight:300;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 14px rgba(0,0,0,.3);transition:opacity .35s ease}
.portal:hover .visual,.portal:focus-visible .visual,.portal.is-focused .visual{filter:blur(0) saturate(1);-webkit-filter:blur(0) saturate(1);transform:scale(1.02)}
.main{min-height:100svh;padding:34px 5vw 70px;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:15px;letter-spacing:.22em;text-decoration:none;white-space:nowrap}.nav{display:flex;gap:28px;align-items:center}.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#454541}.nav a:hover{opacity:.55}.intro{margin-top:clamp(90px,16vh,180px);max-width:760px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}.intro h1{font-size:clamp(42px,8vw,104px);font-weight:300;letter-spacing:.05em;line-height:.95;margin:0}.categories{margin-top:clamp(70px,12vh,140px);border-top:1px solid var(--line)}.category{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none}.category-title{font-size:clamp(24px,4.3vw,56px);font-weight:300;letter-spacing:.04em;transition:transform .25s ease}.category-no{font-size:11px;letter-spacing:.15em;color:var(--muted)}.category:hover .category-title{transform:translateX(8px)}.footer{margin-top:auto;padding-top:80px;display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){.portal{width:min(82vw,430px)}.main{padding:24px 24px 48px}.topbar{align-items:flex-start}.nav{gap:16px;flex-wrap:wrap;justify-content:flex-end}.intro{margin-top:100px}.categories{margin-top:72px}.category{padding:20px 0}}
</style>
</head>
<body>
<section class="landing" id="top"><button class="portal" id="portal" aria-label="Enter Lu Xin works"><span class="visual"></span><span class="name">LU XIN</span></button></section>
<main class="main" id="main"><header class="topbar"><a class="brand" href="#top">LU XIN</a><nav class="nav" aria-label="Main navigation"><a href="#works">Works</a><a href="#about">About</a><a href="#contact">Contact</a></nav></header><section class="intro"><div class="eyebrow">Selected Works</div><h1>Works</h1></section><section class="categories" id="works" aria-label="Work categories"><a class="category" href="#painting"><span class="category-title">Painting</span><span class="category-no">01</span></a><a class="category" href="#ceramics"><span class="category-title">Ceramics</span><span class="category-no">02</span></a><a class="category" href="#fiber"><span class="category-title">Fiber</span><span class="category-no">03</span></a><a class="category" href="#mixed-media"><span class="category-title">Mixed Media</span><span class="category-no">04</span></a></section><footer class="footer"><span id="about">Artist · Lu Xin</span><span id="contact">Bangkok</span></footer></main>
<script>
const portal=document.getElementById('portal'),main=document.getElementById('main');let entering=false;
portal.addEventListener('pointerdown',()=>portal.classList.add('is-focused'));
portal.addEventListener('pointerleave',()=>{if(matchMedia('(hover: hover)').matches)portal.classList.remove('is-focused')});
portal.addEventListener('click',()=>{if(entering)return;entering=true;portal.classList.add('is-focused');const delay=matchMedia('(hover: none)').matches?650:140;setTimeout(()=>{main.scrollIntoView({behavior:'smooth'});entering=false},delay)});
</script>
</body>
</html>
